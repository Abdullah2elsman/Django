{% extends "base.html" %}

{% block content %}
<div class="card shadow mx-auto" style="max-width: 500px;">
    <div class="card-header bg-primary text-white">
        <h4 class="mb-0">Add New Trainee</h4>
    </div>
    <div class="card-body">
        <form method="POST">
            {% csrf_token %} <div class="mb-3">
                <label class="form-label">Trainee Name</label>
                <input type="text" name="trainee_name" class="form-control" placeholder="Enter full name" required>
            </div>
            <button type="submit" class="btn btn-success w-100">Save Trainee</button>
            <a href="{% url 'trainee_list' %}" class="btn btn-secondary w-100 mt-2">Cancel</a>
        </form>
    </div>
</div>
{% endblock %}
