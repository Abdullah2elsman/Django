{% extends "base.html" %}

{% block title %}Trainee Details{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card shadow border-0">
            <div class="card-body text-center p-5">
                <div class="mb-4">
                    <i class="bi bi-person-badge text-primary" style="font-size: 5rem;"></i>
                </div>
                <h2 class="card-title fw-bold text-uppercase">{{ trainee.name }}</h2>
                <p class="text-muted">Registration ID: #{{ trainee.id }}</p>
                <hr>
                <div class="d-flex justify-content-center gap-3">
                    <a href="{% url 'trainee_list' %}" class="btn btn-secondary">
                        <i class="bi bi-arrow-left"></i> Back to List
                    </a>
                    <a href="{% url 'trainee_update' trainee.id %}" class="btn btn-warning">
                        <i class="bi bi-pencil"></i> Edit Profile
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
