{% extends "base.html" %}

{% block title %}Confirm Delete{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card border-danger shadow">
            <div class="card-body text-center py-4">
                <i class="bi bi-exclamation-triangle text-danger mb-3" style="font-size: 3rem;"></i>
                <h4 class="card-title">Are you sure?</h4>
                <p class="card-text text-muted">
                    You are about to delete <strong>"{{ trainee.name }}"</strong>.<br>
                    This action cannot be undone.
                </p>
                <form method="POST">
                    {% csrf_token %}
                    <button type="submit" class="btn btn-danger px-4">Yes, Delete</button>
                    <a href="{% url 'trainee_list' %}" class="btn btn-light border px-4">No, Keep it</a>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
