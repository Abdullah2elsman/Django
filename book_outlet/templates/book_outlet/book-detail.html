{% extends "book_outlet/base.html" %}

{% block title %}
    {{ title }}
{% endblock %}

{% block content %}
    <h1>{{ title }}</h1>
    <h2>{{ author }}</h2>
    <p>{{ rating }}</p>
    {% if is_bestselling %}
        <p>This book is a bestseller</p>
    {% else %}
        <p>This book is not a bestseller</p>
    {% endif %}
{% endblock %}
